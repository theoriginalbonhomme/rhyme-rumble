<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhyme Rumble</title>
<meta name="theme-color" content="#FFCE1F">
<meta name="description" content="Design your rapper, grab the mic and battle your friends online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one chunky sticker-sheet column on a sunny halftone wall; the battle itself moves to a dark stage. */
:root{
  --ink:#1C1233; --paper:#FBF8FF; --sun:#FFCE1F; --pink:#FF4F8B; --teal:#19C6C9;
  --grape:#7A4DFF; --stage:#24134A; --stage2:#3A1F73; --ok:#27B863; --muted:#5F5480; --gold:#F2B705;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); font-size:17px; line-height:1.45; color:var(--ink);
  background:var(--sun) radial-gradient(circle,rgba(28,18,51,.1) 1.6px,transparent 1.8px) 0 0/15px 15px;
  min-height:100vh; min-height:100dvh;
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);
  transition:background-color .4s;
}
body.stage{
  background:var(--stage) radial-gradient(ellipse 80% 55% at 50% 0,rgba(255,206,31,.28),transparent 70%) no-repeat;
  color:var(--paper);
}
#app{max-width:600px; margin:0 auto; padding-block:20px 48px; display:flex; flex-direction:column; gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display); font-weight:400; font-size:1.25rem; line-height:1.15; text-wrap:balance}
.small{font-size:.88rem; color:var(--muted)}
body.stage .small{color:#CFC4F2}
body.stage .card .small,body.stage .judge .small{color:var(--muted)}
.center{text-align:center}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px dashed var(--grape); outline-offset:3px}
body.stage :focus-visible{outline-color:var(--sun)}

/* logo */
.logo{font-family:var(--display); font-size:clamp(2.7rem,13vw,4.9rem); line-height:.92; text-align:center;
  color:var(--pink); -webkit-text-stroke:2px var(--ink); text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--teal);
  transform:rotate(-3deg); margin:14px 0 10px}
.logo span{display:block}
.logo span+span{color:var(--paper)}
.tag{text-align:center; font-weight:500; font-size:1.08rem; text-wrap:balance}

/* surfaces */
.card{background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:20px;
  box-shadow:5px 5px 0 var(--ink); padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.grow{flex:1 1 0; min-width:0}
.btn{font-family:var(--display); font-size:1rem; line-height:1.1; padding:.85em 1.1em; min-height:52px;
  background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:14px;
  box-shadow:4px 4px 0 var(--ink); cursor:pointer; text-align:center; transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.pink{background:var(--pink)} .btn.teal{background:var(--teal)} .btn.sun{background:var(--sun)}
.btn.big{font-size:1.25rem; padding:1em 1.2em; width:100%}
.btn.mini{font-size:.8rem; min-height:40px; padding:.55em .8em; box-shadow:3px 3px 0 var(--ink); border-radius:11px}
body.stage .btn{box-shadow:4px 4px 0 #000}
.field{font-family:var(--display); font-size:1.15rem; padding:.6em .7em; min-height:52px; width:100%; min-width:0;
  border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink)}
.field.code{letter-spacing:.18em; text-transform:uppercase; text-align:center; padding-inline:.3em}
label.lab{font-weight:700; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* avatars */
.av{display:block; width:100%; aspect-ratio:1; border:3px solid var(--ink); border-radius:22%; overflow:hidden; background:#fff}
.av svg{display:block; width:100%; height:100%}
.me{display:flex; gap:14px; align-items:center}
.me .av{width:92px; flex:none}
.name{font-family:var(--display); font-size:1.2rem; line-height:1.1; overflow-wrap:anywhere}

.steps{display:grid; gap:10px; padding:0; margin:0; list-style:none; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:12px; align-items:flex-start}
.steps li::before{content:counter(s); font-family:var(--display); flex:none; width:34px; height:34px; display:grid; place-items:center;
  background:var(--teal); border:3px solid var(--ink); border-radius:50%}

/* creator */
.creator{display:grid; gap:18px}
.preview{position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:2; display:flex; gap:14px; align-items:center;
  background:var(--paper); border:3px solid var(--ink); border-radius:20px; box-shadow:5px 5px 0 var(--ink); padding:12px}
.preview .av{width:112px; flex:none}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.chip{font-weight:700; font-size:.92rem; min-height:42px; padding:.4em .85em; background:#fff; border:3px solid var(--ink); border-radius:999px; cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink); color:var(--paper)}
.chip:disabled{cursor:default}
.sw{width:42px; height:42px; border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.group{display:grid; gap:8px}

/* lobby */
.codebox{text-align:center; background:var(--grape); color:var(--paper)}
.codebig{font-family:var(--display); font-size:clamp(2.1rem,11.5vw,3.8rem); letter-spacing:.1em; line-height:1; text-shadow:4px 4px 0 var(--ink); padding-left:.1em}
.codebox .lab{color:#E4DBFF}
.crew{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:12px}
.tile{background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px; display:grid; gap:6px; align-content:start; text-align:center; min-width:0; color:var(--ink)}
button.tile{cursor:pointer}
.tile.pick{background:var(--sun); box-shadow:4px 4px 0 var(--ink)}
.tile.off{opacity:.5}
.tile .nm{font-weight:700; font-size:.92rem; line-height:1.15; overflow-wrap:anywhere}
.badges{display:flex; gap:4px; justify-content:center; align-items:center; align-self:start; flex-wrap:wrap; min-height:1.3em}
.badge{font-family:var(--display); font-size:.62rem; letter-spacing:.04em; padding:.2em .5em; border:2px solid var(--ink); border-radius:999px; background:var(--paper); color:var(--ink)}
.badge.b1{background:var(--pink)} .badge.b2{background:var(--teal)} .badge.you{background:var(--sun)}
.topic{font-family:var(--display); font-size:1.05rem; line-height:1.2}

/* stage */
.hud{display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-family:var(--display); font-size:.86rem; letter-spacing:.04em}
.hud .t{color:var(--sun); text-align:right; min-width:0; overflow-wrap:anywhere}
.face{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end}
.fighter{display:grid; gap:12px; text-align:center; min-width:0; transition:transform .25s,opacity .25s; transform:scale(.86); opacity:.62}
.fighter.on{transform:scale(1); opacity:1}
.nextup{justify-self:center; font-family:var(--display); font-size:.7rem; letter-spacing:.05em; padding:.2em .6em; border:2px solid #000; border-radius:999px; background:var(--teal); color:var(--ink)}
.fighter .av{border-color:#000; transition:transform .07s; max-width:190px; margin:0 auto}
.fighter.on .av{transform:scale(calc(1 + var(--lvl,0)*.09))}
.fighter.on .av{box-shadow:0 0 0 4px var(--sun),0 0 38px rgba(255,206,31,.55)}
.fighter .nm{font-family:var(--display); font-size:.95rem; line-height:1.1; overflow-wrap:anywhere}
.fighter .pts{font-family:var(--display); font-size:1.5rem; color:var(--sun); font-variant-numeric:tabular-nums; line-height:1}
.vs{font-family:var(--display); font-size:1.5rem; color:var(--pink); -webkit-text-stroke:1px #000; text-shadow:2px 2px 0 #000; padding-bottom:3.2rem}
.panel{background:var(--stage2); border:3px solid #000; border-radius:20px; box-shadow:5px 5px 0 #000; padding:18px; display:grid; gap:14px; text-align:center; justify-items:center}
.panel h2{font-size:1.4rem}
.count{font-family:var(--display); font-size:5.5rem; line-height:1; color:var(--sun); text-shadow:5px 5px 0 #000}
.bars{font-family:var(--display); font-size:1.5rem; font-variant-numeric:tabular-nums}
.track{width:100%; height:18px; background:#150A30; border:3px solid #000; border-radius:999px; overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--pink)}
.meter{width:100%; height:26px; background:#150A30; border:3px solid #000; border-radius:10px; overflow:hidden}
.meter i{display:block; height:100%; width:calc(var(--lvl,0)*100%); background:linear-gradient(90deg,var(--teal),var(--sun) 70%,var(--pink)); transition:width .07s}
.dots{display:flex; gap:10px; justify-content:center}
.dots b{width:18px; height:18px; border-radius:50%; background:#150A30; border:3px solid #000}
.dots b.hit{background:var(--sun)}
.eq{display:flex; gap:7px; align-items:flex-end; height:70px}
.eq i{width:14px; background:var(--teal); border:3px solid #000; border-radius:6px; height:calc(14% + var(--lvl,0)*var(--k,60)*1%); transition:height .09s}
.onair{font-family:var(--display); background:var(--pink); color:var(--ink); border:3px solid #000; border-radius:10px; padding:.25em .7em; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.mics{display:flex; gap:8px; justify-content:center}
.mic{width:52px; height:60px; padding:6px; background:#150A30; border:3px solid #000; border-radius:12px; cursor:pointer; color:#6E5BA8}
.mic.lit{color:var(--sun); background:#4A2A8F}
.mic svg{width:100%; height:100%; display:block}
.judge{width:100%; background:var(--paper); color:var(--ink); border:3px solid #000; border-radius:16px; padding:14px; display:grid; gap:10px; text-align:left}
.judge .who{display:flex; gap:12px; align-items:center}
.judge .bot{width:64px; flex:none}
.stat{display:grid; grid-template-columns:5.2em 1fr 2.6em; gap:8px; align-items:center; font-weight:700; font-size:.92rem}
.stat .bar{height:14px; background:#E4DCF7; border:2px solid var(--ink); border-radius:999px; overflow:hidden}
.stat .bar i{display:block; height:100%; background:var(--grape)}
.stat .n{font-family:var(--display); text-align:right; font-variant-numeric:tabular-nums}
.sum{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-family:var(--display); font-size:.86rem}
.pill{border:2px solid var(--ink); border-radius:999px; padding:.25em .7em; background:#fff}
.pill.tot{background:var(--sun)}
.hostbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

/* results */
.winner{text-align:center; display:grid; gap:10px; justify-items:center}
.winner .av{width:min(46vw,190px); box-shadow:0 0 0 5px var(--sun),0 0 60px rgba(255,206,31,.6)}
.crown{font-family:var(--display); font-size:clamp(1.8rem,8vw,2.8rem); line-height:1; color:var(--sun); text-shadow:4px 4px 0 #000; text-wrap:balance}
.vrow{display:grid; gap:8px; padding:12px 0; border-top:2px dashed #C9BEEA}
.vrow:first-of-type{border-top:0; padding-top:0}
.vhead{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}

.lost{background:var(--pink); color:var(--ink); border:3px solid var(--ink); border-radius:14px; padding:10px 14px; font-weight:700; text-align:center}
.botline{font-family:var(--display); font-size:clamp(1.15rem,5.2vw,1.6rem); line-height:1.25; color:var(--sun); text-wrap:balance; min-height:2.5em}
.lyrics{width:100%; text-align:left; background:#150A30; border:3px solid #000; border-radius:14px; padding:12px 14px; font-weight:500; line-height:1.5}
.mlab{color:#CFC4F2}
.card .mlab{color:var(--muted)}
.rooms{display:grid; gap:10px}
.roomrow{display:flex; gap:12px; align-items:center; text-align:left; width:100%; padding:10px 12px; background:#fff; border:3px solid var(--ink); border-radius:14px; cursor:pointer; color:var(--ink)}
.roomrow.hot{background:var(--sun); box-shadow:4px 4px 0 var(--ink)}
.roomrow .rc{font-family:var(--display); letter-spacing:.08em; font-size:1.05rem; flex:none}
.roomrow .rs{display:grid; min-width:0; font-size:.9rem; line-height:1.3}
.roomrow .rs span{color:var(--muted); overflow-wrap:anywhere}
.panel + .panel{margin-top:0}
.share .row a{text-decoration:none}
.minis{display:grid; gap:10px}
.mg{display:grid; gap:2px; text-align:left; width:100%; padding:12px 14px; background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; color:var(--ink)}
.mg b{font-family:var(--display); font-weight:400; font-size:1.05rem}
.mg span{color:var(--muted); font-size:.9rem}
.mg:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.badgelist{display:flex; flex-wrap:wrap; gap:6px}
.wordrow{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.bigword{font-family:var(--display); font-size:clamp(1.2rem,6vw,1.7rem); background:var(--sun); color:var(--ink); border:3px solid var(--ink); border-radius:14px; padding:.25em .6em; box-shadow:3px 3px 0 var(--ink); overflow-wrap:anywhere}
.stagepanel{gap:18px}
.won{display:grid; gap:6px; justify-items:center; text-align:center; background:var(--sun); border:3px solid var(--ink); border-radius:16px; padding:14px}
.won .plus{font-family:var(--display); font-size:2rem; line-height:1}
.won .nb,.won .nbadge{font-weight:700}
.target{font-family:var(--display); font-size:clamp(2.4rem,14vw,4rem); line-height:1; text-align:center; color:var(--pink); -webkit-text-stroke:2px var(--ink); text-shadow:3px 3px 0 var(--ink)}
.target.small-t{font-size:2rem}
.track.light{background:#E4DCF7; border-color:var(--ink)}
.track.light i{background:var(--pink)}
.rwlist{display:flex; flex-wrap:wrap; gap:6px; min-height:2em; align-content:flex-start}
.rw{font-weight:700; padding:.2em .6em; border:2px solid var(--ink); border-radius:999px; background:#fff}
.rw.ok{background:var(--teal)}
.rw.no{text-decoration:line-through; color:var(--muted)}
.vsrow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.vsrow > div{display:grid; gap:6px; align-content:start; min-width:0}
.wk{background:var(--paper) radial-gradient(circle at 100% 0, rgba(255,79,139,.18), transparent 55%)}
.winrow{display:flex; gap:12px; align-items:center; border-top:2px dashed #C9BEEA; padding-top:12px}
.winrow .av,.entry .av{width:58px; flex:none}
.entry{display:flex; gap:10px; align-items:center; padding:10px 0; border-top:2px dashed #C9BEEA}
.entry:first-of-type{border-top:0}
.entry.voted{background:linear-gradient(90deg, rgba(255,206,31,.35), transparent); border-radius:12px; padding-inline:6px}
.entry .nm{font-weight:700; overflow-wrap:anywhere}
.eacts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
#toast{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); margin:0 auto; max-width:520px; z-index:20;
  background:var(--ink); color:var(--paper); border:3px solid var(--paper); border-radius:14px; padding:12px 16px; font-weight:500; text-align:center; overflow-wrap:anywhere}
.busy{min-height:55vh; display:grid; place-content:center; gap:16px; text-align:center}
.spin{width:54px; height:54px; margin:0 auto; border:6px solid var(--ink); border-top-color:var(--pink); border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:640px){ .creator{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} .fighter .av{transform:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* =====================================================================
   RHYME RUMBLE
   One file, no installs. Online rooms are kept on a small Supabase
   database (see rhyme-rumble-setup.sql); the robot battle works offline.
   ===================================================================== */
const GAME = 'Rhyme Rumble';
const ROOM_PREFIX = 'rhyme-rumble-v1-';
const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const RATE = 16000;           // voice clips travel as 16 kHz mu-law
const TOPICS = ['Freestyle: anything goes','Pizza vs. tacos','My pet is cooler than yours','Best excuse for not doing homework',
  'Monday mornings','Who is the real boss of this house?','Superpowers I should have','The worst vegetable ever','If I were the teacher',
  'Summer vs. winter','My sneakers are faster','Breakfast for dinner','Video game legends','Aliens landed in the backyard',
  'The dance floor is mine','Why I should stay up late','Robots doing my chores','Cats vs. dogs'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

/* ---------- rapper designer --------------------------------------- */
const AV = {
  skin:['#FFDFC4','#F2C09A','#D9A066','#B97A4A','#8D5524','#5C3A21'],
  hairc:['#1C1233','#5B3A1E','#D9A521','#C8431F','#2B6CF6','#FF4F8B','#19B58A','#F3F0FF'],
  fit:['#FF4F8B','#19C6C9','#7A4DFF','#FFCE1F','#FF7A1A','#27B863','#35284F','#F3F0FF'],
  bg:['#19C6C9','#FF4F8B','#7A4DFF','#FFCE1F','#27B863','#FF7A1A'],
  hair:['Bald','Short','Afro','Mohawk','Long','Buns','Locs','Cap','Beanie'],
  eyes:['Chill','Shades','Wink','Fierce','Stars'],
  mouth:['Smile','Grin','Ooh','Smirk','Gold teeth'],
  outfit:['Hoodie','Tee','Jacket','Jersey'],
  extra:['None','Chain','Headphones','Earring']
};
const AV_GROUPS = [
  ['skin','Skin','sw'],['hair','Hair or hat','chip'],['hairc','Hair or hat colour','sw'],['eyes','Eyes','chip'],
  ['mouth','Mouth','chip'],['outfit','Outfit','chip'],['fit','Outfit colour','sw'],['extra','Extras','chip'],['bg','Backdrop','sw']
];
const NAME_A = ['MC','DJ','Lil','Big','Young','Captain','Doctor','Sir','Queen','King','Professor'];
const NAME_B = ['Thunder','Pancake','Noodle','Rocket','Blizzard','Mango','Pixel','Tornado','Waffle','Comet','Sneaker','Yeti','Pickle','Laser','Banjo','Meatball','Turbo'];
const rnd = n => Math.floor(Math.random() * n);
const randomName = () => NAME_A[rnd(NAME_A.length)] + ' ' + NAME_B[rnd(NAME_B.length)];
const randomAv = () => Object.fromEntries(Object.keys(AV).map(k => [k, rnd(AV[k].length)]));
function cleanAv(a){ const o = {}; for(const k in AV){ const v = Number(a && a[k]) | 0; o[k] = v >= 0 && v < AV[k].length ? v : 0; } return o; }
const cleanName = n => (String(n ?? '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 18)) || 'Mystery MC';

function star(cx, cy, r){
  let p = ''; for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); }
  return p + 'Z';
}
function avatarSVG(cfg){
  const c = cleanAv(cfg), I = '#1C1233', S = AV.skin[c.skin], H = AV.hairc[c.hairc], F = AV.fit[c.fit];
  const st = `stroke="${I}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
  const hair = AV.hair[c.hair], fit = AV.outfit[c.outfit], eyes = AV.eyes[c.eyes], mouth = AV.mouth[c.mouth], extra = AV.extra[c.extra];
  let s = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rapper character"><rect width="200" height="200" fill="${AV.bg[c.bg]}"/>`;
  s += `<path d="M100 100 L-40 -40 L40 -60Z M100 100 L240 -40 L160 -60Z M100 100 L-60 120 L-60 60Z M100 100 L260 120 L260 60Z" fill="#fff" opacity=".16"/>`;
  // behind the head
  if(fit === 'Hoodie') s += `<path d="M46 156 C36 92 58 50 100 50 C142 50 164 92 154 156Z" fill="${F}" ${st}/>`;
  if(hair === 'Afro') s += `<circle cx="100" cy="72" r="57" fill="${H}" ${st}/>`;

    const fill = n % 4 === 3;
    for(let s = 0; s < 16; s++){
      const ts = t + n * bar + s * step + (s % 2 ? b.swing * step : 0);
      if(b.kick[s] === 'x') kick(ac, out, ts);

      if(b.hat[s] === 'x'){

function judgeVerse(x, bpm, bars){
  const F = 320, rms = frameRms(x, F), n = rms.length;               // 20 ms frames
  if(n < 20) return { flow:0, energy:0, stamina:0 };
  const floor = pct(rms, .1), peak = pct(rms, .95), thr = Math.max(.012, floor * 2.5, peak * .15);
  let voiced = 0, sum = 0; const on = [];
  for(let i = 0; i < n; i++){
    if(rms[i] > thr){ voiced++; sum += rms[i];
      const prev = i >= 3 ? (rms[i - 1] + rms[i - 2] + rms[i - 3]) / 3 : 0;
      if(rms[i] > prev * 1.6 && (!on.length || i - on[on.length - 1] >= 4)) on.push(i);
    }
  }
  if(voiced < 10 || peak < .015) return { flow:0, energy:0, stamina:0 };
  const stamina = Math.round(10 * clamp(voiced / n / .55, 0, 1));
  const db = 20 * Math.log10(sum / voiced);
  const energy = Math.round(10 * clamp((db + 40) / 26, 0, 1));
  const grid = 60 / bpm / (bpm < 85 ? 4 : 2);
  let d = 0; for(const i of on){ const t = i * F / RATE; d += Math.abs(t - Math.round(t / grid) * grid); }
  const tight = on.length ? clamp(1 - (d / on.length) / (grid / 4), 0, 1) : 0;
  const busy = clamp(on.length / (bars * 2), 0, 1);
  const flow = Math.round(10 * (.35 + .65 * Math.pow(tight, .7)) * busy);
  return { flow:clamp(flow, 0, 10), energy:clamp(energy, 1, 10), stamina:clamp(stamina, 1, 10) };
}

  if(j.energy >= 8) good.push('LOUD and proud. My speakers are shaking.'); else if(j.energy <= 4) tip.push('Get closer to the mic and turn it up!');
  if(j.stamina >= 8) good.push('No breaks, no brakes!'); else if(j.stamina <= 4) tip.push('Lots of quiet spots in there. Fill those bars!');

}

let dlBusy = false;
function wavBlob(d, rate){
  const b = new ArrayBuffer(44 + d.length * 2), v = new DataView(b), w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + d.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, d.length * 2, true);
  for(let i = 0; i < d.length; i++){ const s = clamp(d[i], -1, 1); v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true); }
  return new Blob([b], { type:'audio/wav' });
}
async function renderBattle(){
  const SR = 32000, vs = S.verses.filter(v => !v.skipped && clips.has(v.id)); if(!vs.length) return null;
  let total = .3; const plan = vs.map(v => { const c = clips.get(v.id), bar = 240 / (BEATS[v.beat] || BEATS.boom).bpm, at = total; total += Math.max(v.bars * bar, c.f.length / RATE) + .8; return { v, c, at }; });
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext, oc = new OC(1, Math.ceil(total * SR), SR);
  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 6;
  const master = oc.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(oc.destination);
  for(const { v, c, at } of plan){
    const beatOut = oc.createGain(); beatOut.gain.value = .5; beatOut.connect(master); scheduleBeat(oc, beatOut, v.beat, at, v.bars, false);
    const buf = oc.createBuffer(1, c.f.length, RATE); buf.getChannelData(0).set(c.f);
    const src = oc.createBufferSource(), g = oc.createGain(); g.gain.value = 1.3; src.buffer = buf; src.connect(g); g.connect(master); src.start(at);
  }
  const d = (await oc.startRendering()).getChannelData(0); let pk = 0; for(let i = 0; i < d.length; i++){ const a = Math.abs(d[i]); if(a > pk) pk = a; }
  if(pk > .95){ const g = .95 / pk; for(let i = 0; i < d.length; i++) d[i] *= g; }
  return wavBlob(d, SR);
}

}

async function startVerse(){
  if(rec || sending || !isTurn(me.pid)) return;
  stopAudio();
  const ac = audio(); let mic;
  try{ mic = await openMic(); }catch(e){ return toast(micHelp(e), 7000); }
  if(!isTurn(me.pid)){ mic.close(); return; }
  const out = ac.createGain(); out.gain.value = .8; out.connect(MASTER);
  const sch = scheduleBeat(ac, out, S.set.beat, ac.currentTime + .45, S.set.bars, true);
  const lat = clamp((ac.outputLatency || 0) + (ac.baseLatency || 0) + mic.inLat, 0, .35);
  mic.chunks = [];
  rec = { mic, out, sch, lat, beat:S.set.beat, bars:S.set.bars, done:false };
  rec.timer = setTimeout(() => finishVerse(), (sch.end + lat - ac.currentTime) * 1000 + 180);
  if(!S.solo) mutate(d => { if(performerOf(d) !== me.pid) return false; d.rec = { pid:me.pid, at:Date.now() }; });   // others see "is rapping now"

}
function abortRec(){ if(!rec) return; clearTimeout(rec.timer); try{ rec.out.disconnect(); }catch{} rec.mic.close(); rec = null; }

  if(rec && rec.mini) return finishMini();
  const r = rec; if(!r || r.done) return; r.done = true; clearTimeout(r.timer);
  const ac = audio(), sr = ac.sampleRate, endT = Math.min(ac.currentTime, r.sch.end + r.lat);
  try{ r.out.disconnect(); }catch{}
  const chunks = r.mic.chunks; r.mic.chunks = null; r.mic.close();
  const f0 = Math.round((r.sch.verseStart + r.lat) * sr), n = Math.max(0, Math.round(endT * sr) - f0);
  if(n < sr * 1.5){ rec = null; clearRecFlag(); toast('That was too short to count. Try again!'); render(); return; }
  render();
  setTimeout(() => {
    const x = new Float32Array(n);
    for(const { f, b } of chunks){ const off = f - f0; if(off >= n || off + b.length <= 0) continue;
      const a = Math.max(0, -off), z = Math.min(b.length, n - off); x.set(b.subarray(a, z), off + a); }
    const y = downsample(x, sr, RATE), bpm = BEATS[r.beat].bpm;
    const judge = judgeVerse(y, bpm, r.bars);
    let pk = 0; for(let i = 0; i < y.length; i++){ const a = Math.abs(y[i]); if(a > pk) pk = a; }
    if(pk > .02){ const g = Math.min(8, .92 / pk); for(let i = 0; i < y.length; i++) y[i] *= g; }
    const pcm = muEncode(y), id = rid(8);

    const bars = clamp(Math.ceil((y.length / RATE) / r.sch.bar - .02), 1, r.bars);
    rec = null;
    const entry = { id, by:me.pid, round:Math.floor(S.verses.length / 2) + 1, beat:r.beat, bars, dur:pcm.length / RATE,
      judge:{ flow:c10(judge.flow), energy:c10(judge.energy), stamina:c10(judge.stamina) }, ratings:{} };
    if(S.solo) rules.addVerse(entry); else { sending = { entry, pcm, state:'up' }; sendVerse(); }
    render();

}
async function sendVerse(){
  const s = sending; if(!s) return;

  if(sending !== s) return;
  if(!ok){ s.state = 'fail'; render(); return; }

  if(sending !== s) return;
  if(saved || (S && S.verses.some(v => v.id === s.entry.id))){ sending = null; render(); }

  else { s.state = 'fail'; render(); }
}

  if(pk > .02){ const g = Math.min(8, .92 / pk); for(let i = 0; i < y.length; i++) y[i] *= g; }

const normWord = s => String(s || '').toLowerCase().trim().replace(/[^a-zäöüõšž]/g, '');
function rhymes(target, w){
  const t = RHYMES[miniSet.lang][target]; if(!t || !w || w === target) return false;
  return t.words.includes(w) || t.ends.some(e => w.length > e.length && w.endsWith(e));
}
function startRush(){
  const keys = Object.keys(RHYMES[miniSet.lang]);
  let target; do target = keys[rnd(keys.length)]; while(mini.target === target && keys.length > 1);
  Object.assign(mini, { stage:'go', target, typed:[], ends:Date.now() + RUSH_SECONDS * 1000, result:null });
  render(); const i = $('#rushin'); if(i) i.focus();

    const left = Math.max(0, mini.ends - Date.now()), b = $('#rushbar'), t = $('#rushleft');
    if(b) b.style.width = (left / (RUSH_SECONDS * 1000) * 100) + '%'; if(t) t.textContent = Math.ceil(left / 1000) + ' s';

function addRhyme(raw){
  if(!mini || mini.stage !== 'go') return;
  const w = normWord(raw); if(!w || mini.typed.some(x => x.w === w)) return;

function endRush(){
  if(!mini || mini.stage !== 'go') return;
  clearInterval(mini.timer);
  const t = RHYMES[miniSet.lang][mini.target], mine = mini.typed.filter(x => x.ok).map(x => x.w);
  const pool = t.words.filter(w => !mine.includes(w)), botN = Math.min(ROBOT_RHYMES[miniSet.level], t.words.length), bot = [];
  while(bot.length < botN && pool.length) bot.push(pool.splice(rnd(pool.length), 1)[0]);
  while(bot.length < botN){ const w = t.words[rnd(t.words.length)]; if(!bot.includes(w)) bot.push(w); }
  const win = mine.length > bot.length, extra = [];
  if(mine.length >= 6) extra.push('machine'); if(win && miniSet.level === 'expert') extra.push('robo');
  mini.bot = bot; mini.stage = 'done';
  mini.result = award(mine.length * 5 + (win ? 10 : 0), 'rush', mine.length, extra);
  render();
}

/* ---------- beat of the week ------------------------------------------
   A new beat every week, made from the week's number. Everyone can send
   one verse of up to about 60 seconds and give one vote. Last week's
   winner is shown on the home screen.                                 */
const WEEK_BEATS = {};
const beatOf = id => BEATS[id] || WEEK_BEATS[id] || BEATS.boom;
function weekBeat(week){
  const id = 'wk' + week; if(WEEK_BEATS[id]) return id;
  let h = 2166136261; for(const c of week) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const r = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const bases = ['boom', 'trap', 'old', 'chill'], base = BEATS[bases[Math.floor(r() * 4)]];
  const kick = base.kick.split('');
  for(let k = 0; k < 2; k++){ const s = [3, 5, 9, 11, 13, 15][Math.floor(r() * 6)]; kick[s] = kick[s] === 'x' ? '.' : 'x'; }
  kick[0] = 'x';
  const shift = [-2, 0, 2, 3, 5][Math.floor(r() * 5)];
  WEEK_BEATS[id] = Object.assign({}, base, { name:'Week ' + week.split('W')[1] + ' beat', bpm:base.bpm + Math.round(r() * 10 - 5), kick:kick.join(''), root:base.root + shift });
  return id;
}
const barsFor60 = id => clamp(Math.round(60 / (240 / beatOf(id).bpm)), 8, 32);
let ch = { info:null, entries:null, prev:null, myVote:null, loading:false, err:null };
function chIdent(){ let id = store.get('rr.chid', null); if(!id || !id.pid){ id = { pid:rid(12), token:rid(32), joined:false }; store.set('rr.chid', id); } return id; }
async function chEnsure(){
  const id = chIdent(); if(id.joined) return id;
  const r = await rpc('rr_ch_join', { p_pid:id.pid, p_token:id.token });
  if(r === 'bad_token'){ const n = { pid:rid(12), token:rid(32), joined:false }; store.set('rr.chid', n); return chEnsure(); }
  if(r !== 'ok') throw Object.assign(new Error('join'), { code:'server' });
  id.joined = true; store.set('rr.chid', id); return id;
}
async function loadChallenge(full){
  if(!API) return;
  if(ch.loading){ if(full) ch.wantFull = true; return; }      // run again with the list once the current load finishes
  ch.loading = true; ch.wantFull = false;
  try{
    ch.info = await rpc('rr_ch_info', {});
    weekBeat(ch.info.week); weekBeat(ch.info.prev);
    const prev = await rpc('rr_ch_list', { p_week:ch.info.prev });
    ch.prev = prev && prev.length ? prev[0] : null;
    if(ch.prev && ch.prev.pid === chIdent().pid && !pts.badges.includes('weekwin')){ pts.badges.push('weekwin'); store.set('rr.pts', pts); }
    if(full){ ch.entries = await rpc('rr_ch_list', { p_week:ch.info.week }); ch.myVote = await rpc('rr_ch_myvote', { p_pid:chIdent().pid }); }
    ch.err = null;

async function chPlay(week, pid, name){
  const id = 'ch' + week + pid;

    try{
      const parts = await rpc('rr_ch_audio', { p_week:week, p_pid:pid });

      const bins = parts.map(b => Uint8Array.from(atob(b), c => c.charCodeAt(0))), pcm = new Uint8Array(bins.reduce((a, b) => a + b.length, 0));
      let o = 0; for(const b of bins){ pcm.set(b, o); o += b.length; }

    }catch(e){ return toast(netHelp(e)); }
  }
  const beat = weekBeat(week); audio(); playVerse({ id, beat, bars:clamp(Math.ceil(clips.get(id).f.length / RATE / (240 / beatOf(beat).bpm)), 1, 32) });
}
async function chSend(){
  const m = mini; if(!m || !m.take || m.sending) return;

      const part = pcm.subarray(i * PART, (i + 1) * PART); let s = '';
      for(let k = 0; k < part.length; k += 0x8000) s += String.fromCharCode.apply(null, part.subarray(k, k + 0x8000));
      let ok = false;

      if(!ok) throw Object.assign(new Error('upload'), { code:'server' });
    }
    const r = await rpc('rr_ch_enter', { p_pid:id.pid, p_token:id.token, p_name:me.name, p_av:me.av, p_judge:m.judge, p_parts:n });
    if(r !== 'ok') throw Object.assign(new Error(r), { code:'server' });

/* ---------- sharing ------------------------------------------------ */
const roomLink = c => location.origin + location.pathname + '#' + c;
const shareLink = () => S && !S.solo && roomCode ? roomLink(roomCode) : '';
function shareText(){
  const s = S.set, tot = totals(), A = (S.players[s.a] || {}).name, B = (S.players[s.b] || {}).name;
  return `${A} vs. ${B} in Rhyme Rumble: ${tot[s.a] || 0} to ${tot[s.b] || 0}. Listen to the battle:`;
}
async function shareTo(title, text, url){
  try{ if(navigator.share){ await navigator.share({ title, text, url }); return true; } }catch(e){ if(e && e.name === 'AbortError') return true; }
  try{ await navigator.clipboard.writeText(url); toast('Link copied. Paste it to your friend.'); return true; }catch{ toast(url, 12000); return false; }
}
async function invite(){
  const url = roomLink(S.code), text = `Join my ${GAME} room ${S.code}:`;
  if(navigator.share && matchMedia('(pointer:coarse)').matches) return shareTo(GAME, text, url);
  try{ await navigator.clipboard.writeText(url); toast('Invite link copied. Send it to your crew!'); }catch{ toast(url, 12000); }
}
function remind(){ const P = S.players[performer()] || { name:'' }; shareTo(GAME, `${P.name}, it's your turn in our Rhyme Rumble battle! Tap to answer:`, roomLink(S.code)); }
async function sendBattle(){
  if(dlBusy || !S) return; dlBusy = true; render();
  let blob = null; try{ blob = await renderBattle(); }catch(e){ console.warn(e); }
  dlBusy = false;
  if(!blob){ render(); return toast('Could not make the sound file on this device.'); }
  const file = new File([blob], 'rhyme-rumble-battle.wav', { type:'audio/wav' }), link = shareLink();
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Rhyme Rumble battle', text:link ? shareText() + ' ' + link : 'Our Rhyme Rumble battle' });
      render(); return;
    }
  }catch(e){ if(e && e.name === 'AbortError'){ render(); return; } }
  if(link){ shareOpen = true; render(); const el = $('#sharelink'); if(el) el.scrollIntoView({ block:'center' }); }
  else { saveBlob(blob); render(); }
}
function saveBlob(blob){
  const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = 'rhyme-rumble-battle.wav'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Battle saved as rhyme-rumble-battle.wav');
}

/* ---------- events ------------------------------------------------- */
function saveMe(){
  store.set('rr.me', { name:me.name, av:me.av });
  if(S && myRoom && !S.solo) mutate(d => { if(!d.players[me.pid]) return false; d.players[me.pid] = { name:me.name, av:me.av }; });
  else if(S && S.solo){ S.players[me.pid] = { name:me.name, av:me.av }; }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'creator': draft = { name:me.name, av:{ ...me.av } }; creatorBack = view; view = 'creator'; render(); scrollTo(0, 0); break;
    case 'opt': draft.av[el.dataset.k] = Number(el.dataset.i); render(); break;
    case 'rname': draft.name = randomName(); render(); break;
    case 'rlook': draft.av = randomAv(); render(); break;
    case 'cancelcreator': view = creatorBack; render(); break;
    case 'savecreator': me.name = cleanName(draft.name); me.av = cleanAv(draft.av); view = creatorBack; saveMe(); render(); break;
    case 'create': createRoom(); break;
    case 'room': goRoom(el.dataset.code); break;
    case 'join': joinHere(); break;
    case 'home': if(S) leave(); else { view = 'home'; render(); loadRecent(); } loadChallenge(false); scrollTo(0, 0); break;
    case 'leave': { const c = roomCode; rules.leaveLobby().then(ok => { if(ok){ forgetRoom(c); leave(); } }); break; }
    case 'solo': view = 'solo'; render(); scrollTo(0, 0); break;
    case 'soloset': { const k = el.dataset.k, v = el.dataset.v; solo[k] = k === 'bars' || k === 'rounds' ? Number(v) : v; if(k === 'beat') previewBeat(v); render(); break; }
    case 'solostart': startSolo(); break;
    case 'robotgo': robotGo(); break;
    case 'download': (async () => { if(dlBusy) return; dlBusy = true; render(); try{ const b = await renderBattle(); if(b) saveBlob(b); else toast('There are no recorded verses to save.'); }catch(err){ console.warn(err); toast('Could not make the sound file on this device.'); } dlBusy = false; render(); })(); break;
    case 'send': sendBattle(); break;
    case 'mini': openMini(el.dataset.game); break;
    case 'hearweek': if(ch.info) previewBeat(weekBeat(ch.info.week)); break;
    case 'chplay': chPlay(el.dataset.week, el.dataset.pid, el.dataset.name); break;
    case 'chvote': chVote(el.dataset.pid); break;
    case 'chsend': chSend(); break;
    case 'chredo': stopAudio(); mini.stage = 'intro'; mini.take = null; render(); break;
    case 'chrefresh': loadChallenge(true); break;
    case 'minihome': stopAudio(); abortRec(); if(mini) clearInterval(mini.timer); mini = null; view = 'home'; render(); loadChallenge(false); scrollTo(0, 0); break;
    case 'miniset': { const k = el.dataset.k; miniSet[k] = el.dataset.v; store.set('rr.mini', miniSet); if(k === 'beat') previewBeat(el.dataset.v); if(k === 'lang' && mini && mini.game === 'words') mini.words = pickWords(miniSet.lang); render(); break; }
    case 'newwords': mini.words = pickWords(miniSet.lang); render(); break;
    case 'minirec': miniRecord(); break;
    case 'miniplay': audio(); playVerse(mini.take); break;
    case 'usedword': { const w = el.dataset.w, u = mini.used; if(u.includes(w)) u.splice(u.indexOf(w), 1); else u.push(w); render(); break; }
    case 'collect': collectWords(); break;
    case 'miniagain': stopAudio(); mini = { game:mini.game, stage:'intro', words:mini.game === 'words' ? pickWords(miniSet.lang) : null }; render(); scrollTo(0, 0); break;
    case 'rushgo': audio(); startRush(); break;
    case 'copylink': { const v = shareLink(); navigator.clipboard.writeText(v).then(() => toast('Link copied.'), () => { const i = $('#sharelink'); if(i){ i.select(); } toast('Select the link and copy it.'); }); break; }
    case 'battleme': createRoom(); break;
    case 'invite': invite(); break;
    case 'remind': remind(); break;
    case 'miccheck': micCheck(); break;
    case 'hear': previewBeat(S.set.beat); break;
    case 'drop': startVerse(); break;
    case 'done': finishVerse(); break;
    case 'resend': sendVerse(); break;
    case 'redo': sending = null; clearRecFlag(); render(); break;
    case 'replay': { audio(); const v = S.verses.find(x => x.id === el.dataset.id); if(v) playVerse(v); break; }
    case 'rate': audio(); rules.rate(el.dataset.id, Number(el.dataset.n)); break;
  }
  if(!S || !myRoom || roomClosed) return;
  switch(act){
    case 'pick': rules.pick(el.dataset.pid); break;
    case 'set': { const k = el.dataset.k, v = el.dataset.v; rules.set(k, k === 'beat' ? v : Number(v)); if(k === 'beat') previewBeat(v); break; }
    case 'spin': { let t; do t = TOPICS[rnd(TOPICS.length)]; while(t === S.set.topic); rules.set('topic', t); break; }
    case 'start': rules.start(); break;
    case 'end': if(S.solo) leave(); else if(canSteer()) rules.end(); break;
    case 'rematch': if(canSteer()) rules.rematch(); break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'rapname' && draft) draft.name = e.target.value;
  if(e.target.id === 'code'){ joinCode = e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6); }
});
document.addEventListener('submit', e => { e.preventDefault();
  if(e.target.dataset.form === 'join') goRoom($('#code').value);
  if(e.target.dataset.form === 'rush'){ const i = $('#rushin'); addRhyme(i.value); i.value = ''; i.focus(); } });
window.addEventListener('hashchange', () => { const c = (location.hash || '').replace(/[^A-Za-z]/g, '').toUpperCase(); if(c.length === 6 && c !== roomCode) goRoom(c); });

/* ---------- boot --------------------------------------------------- */
joinCode = (location.hash || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 6);
recent = store.get('rr.rooms', []);
render();
if(joinCode.length === 6 && API) goRoom(joinCode); else loadRecent();
loadChallenge(false);
</script>
</body>
</html>
