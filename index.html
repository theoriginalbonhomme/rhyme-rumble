<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhyme Rumble</title>
<meta name="theme-color" content="#FFCE1F">
<meta name="description" content="Design your rapper, grab the mic and battle your friends online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one chunky sticker-sheet column on a sunny halftone wall; the battle itself moves to a dark stage. */
:root{
  --ink:#1C1233; --paper:#FBF8FF; --sun:#FFCE1F; --pink:#FF4F8B; --teal:#19C6C9;
  --grape:#7A4DFF; --stage:#24134A; --stage2:#3A1F73; --ok:#27B863; --muted:#5F5480; --gold:#F2B705;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); font-size:17px; line-height:1.45; color:var(--ink);
  background:var(--sun) radial-gradient(circle,rgba(28,18,51,.1) 1.6px,transparent 1.8px) 0 0/15px 15px;
  min-height:100vh; min-height:100dvh;
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);
  transition:background-color .4s;
}
body.stage{
  background:var(--stage) radial-gradient(ellipse 80% 55% at 50% 0,rgba(255,206,31,.28),transparent 70%) no-repeat;
  color:var(--paper);
}
#app{max-width:600px; margin:0 auto; padding-block:20px 48px; display:flex; flex-direction:column; gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display); font-weight:400; font-size:1.25rem; line-height:1.15; text-wrap:balance}
.small{font-size:.88rem; color:var(--muted)}
body.stage .small{color:#CFC4F2}
body.stage .card .small,body.stage .judge .small{color:var(--muted)}
.center{text-align:center}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px dashed var(--grape); outline-offset:3px}
body.stage :focus-visible{outline-color:var(--sun)}

/* logo */
.logo{font-family:var(--display); font-size:clamp(2.7rem,13vw,4.9rem); line-height:.92; text-align:center;
  color:var(--pink); -webkit-text-stroke:2px var(--ink); text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--teal);
  transform:rotate(-3deg); margin:14px 0 10px}
.logo span{display:block}
.logo span+span{color:var(--paper)}
.tag{text-align:center; font-weight:500; font-size:1.08rem; text-wrap:balance}

/* surfaces */
.card{background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:20px;
  box-shadow:5px 5px 0 var(--ink); padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.grow{flex:1 1 0; min-width:0}
.btn{font-family:var(--display); font-size:1rem; line-height:1.1; padding:.85em 1.1em; min-height:52px;
  background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:14px;
  box-shadow:4px 4px 0 var(--ink); cursor:pointer; text-align:center; transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.pink{background:var(--pink)} .btn.teal{background:var(--teal)} .btn.sun{background:var(--sun)}
.btn.big{font-size:1.25rem; padding:1em 1.2em; width:100%}
.btn.mini{font-size:.8rem; min-height:40px; padding:.55em .8em; box-shadow:3px 3px 0 var(--ink); border-radius:11px}
body.stage .btn{box-shadow:4px 4px 0 #000}
.field{font-family:var(--display); font-size:1.15rem; padding:.6em .7em; min-height:52px; width:100%; min-width:0;
  border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink)}
.field.code{letter-spacing:.18em; text-transform:uppercase; text-align:center; padding-inline:.3em}
label.lab{font-weight:700; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* avatars */
.av{display:block; width:100%; aspect-ratio:1; border:3px solid var(--ink); border-radius:22%; overflow:hidden; background:#fff}
.av svg{display:block; width:100%; height:100%}
.me{display:flex; gap:14px; align-items:center}
.me .av{width:92px; flex:none}
.name{font-family:var(--display); font-size:1.2rem; line-height:1.1; overflow-wrap:anywhere}

.steps{display:grid; gap:10px; padding:0; margin:0; list-style:none; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:12px; align-items:flex-start}
.steps li::before{content:counter(s); font-family:var(--display); flex:none; width:34px; height:34px; display:grid; place-items:center;
  background:var(--teal); border:3px solid var(--ink); border-radius:50%}

/* creator */
.creator{display:grid; gap:18px}
.preview{position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:2; display:flex; gap:14px; align-items:center;
  background:var(--paper); border:3px solid var(--ink); border-radius:20px; box-shadow:5px 5px 0 var(--ink); padding:12px}
.preview .av{width:112px; flex:none}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.chip{font-weight:700; font-size:.92rem; min-height:42px; padding:.4em .85em; background:#fff; border:3px solid var(--ink); border-radius:999px; cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink); color:var(--paper)}
.chip:disabled{cursor:default}
.sw{width:42px; height:42px; border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.group{display:grid; gap:8px}

/* lobby */
.codebox{text-align:center; background:var(--grape); color:var(--paper)}
.codebig{font-family:var(--display); font-size:clamp(2.1rem,11.5vw,3.8rem); letter-spacing:.1em; line-height:1; text-shadow:4px 4px 0 var(--ink); padding-left:.1em}
.codebox .lab{color:#E4DBFF}
.crew{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:12px}
.tile{background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px; display:grid; gap:6px; align-content:start; text-align:center; min-width:0; color:var(--ink)}
button.tile{cursor:pointer}
.tile.pick{background:var(--sun); box-shadow:4px 4px 0 var(--ink)}
.tile.off{opacity:.5}
.tile .nm{font-weight:700; font-size:.92rem; line-height:1.15; overflow-wrap:anywhere}
.badges{display:flex; gap:4px; justify-content:center; align-items:center; align-self:start; flex-wrap:wrap; min-height:1.3em}
.badge{font-family:var(--display); font-size:.62rem; letter-spacing:.04em; padding:.2em .5em; border:2px solid var(--ink); border-radius:999px; background:var(--paper); color:var(--ink)}
.badge.b1{background:var(--pink)} .badge.b2{background:var(--teal)} .badge.you{background:var(--sun)}
.topic{font-family:var(--display); font-size:1.05rem; line-height:1.2}

/* stage */
.hud{display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-family:var(--display); font-size:.86rem; letter-spacing:.04em}
.hud .t{color:var(--sun); text-align:right; min-width:0; overflow-wrap:anywhere}
.face{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end}
.fighter{display:grid; gap:12px; text-align:center; min-width:0; transition:transform .25s,opacity .25s; transform:scale(.86); opacity:.62}
.fighter.on{transform:scale(1); opacity:1}
.fighter .av{border-color:#000; transition:transform .07s; max-width:190px; margin:0 auto}
.fighter.on .av{transform:scale(calc(1 + var(--lvl,0)*.09))}
.fighter.on .av{box-shadow:0 0 0 4px var(--sun),0 0 38px rgba(255,206,31,.55)}
.fighter .nm{font-family:var(--display); font-size:.95rem; line-height:1.1; overflow-wrap:anywhere}
.fighter .pts{font-family:var(--display); font-size:1.5rem; color:var(--sun); font-variant-numeric:tabular-nums; line-height:1}
.vs{font-family:var(--display); font-size:1.5rem; color:var(--pink); -webkit-text-stroke:1px #000; text-shadow:2px 2px 0 #000; padding-bottom:3.2rem}
.panel{background:var(--stage2); border:3px solid #000; border-radius:20px; box-shadow:5px 5px 0 #000; padding:18px; display:grid; gap:14px; text-align:center; justify-items:center}
.panel h2{font-size:1.4rem}
.count{font-family:var(--display); font-size:5.5rem; line-height:1; color:var(--sun); text-shadow:5px 5px 0 #000}
.bars{font-family:var(--display); font-size:1.5rem; font-variant-numeric:tabular-nums}
.track{width:100%; height:18px; background:#150A30; border:3px solid #000; border-radius:999px; overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--pink)}
.meter{width:100%; height:26px; background:#150A30; border:3px solid #000; border-radius:10px; overflow:hidden}
.meter i{display:block; height:100%; width:calc(var(--lvl,0)*100%); background:linear-gradient(90deg,var(--teal),var(--sun) 70%,var(--pink)); transition:width .07s}
.dots{display:flex; gap:10px; justify-content:center}
.dots b{width:18px; height:18px; border-radius:50%; background:#150A30; border:3px solid #000}
.dots b.hit{background:var(--sun)}
.eq{display:flex; gap:7px; align-items:flex-end; height:70px}
.eq i{width:14px; background:var(--teal); border:3px solid #000; border-radius:6px; height:calc(14% + var(--lvl,0)*var(--k,60)*1%); transition:height .09s}
.onair{font-family:var(--display); background:var(--pink); color:var(--ink); border:3px solid #000; border-radius:10px; padding:.25em .7em; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.mics{display:flex; gap:8px; justify-content:center}
.mic{width:52px; height:60px; padding:6px; background:#150A30; border:3px solid #000; border-radius:12px; cursor:pointer; color:#6E5BA8}
.mic.lit{color:var(--sun); background:#4A2A8F}
.mic svg{width:100%; height:100%; display:block}
.judge{width:100%; background:var(--paper); color:var(--ink); border:3px solid #000; border-radius:16px; padding:14px; display:grid; gap:10px; text-align:left}
.judge .who{display:flex; gap:12px; align-items:center}
.judge .bot{width:64px; flex:none}
.stat{display:grid; grid-template-columns:5.2em 1fr 2.6em; gap:8px; align-items:center; font-weight:700; font-size:.92rem}
.stat .bar{height:14px; background:#E4DCF7; border:2px solid var(--ink); border-radius:999px; overflow:hidden}
.stat .bar i{display:block; height:100%; background:var(--grape)}
.stat .n{font-family:var(--display); text-align:right; font-variant-numeric:tabular-nums}
.sum{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-family:var(--display); font-size:.86rem}
.pill{border:2px solid var(--ink); border-radius:999px; padding:.25em .7em; background:#fff}
.pill.tot{background:var(--sun)}
.hostbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

/* results */
.winner{text-align:center; display:grid; gap:10px; justify-items:center}
.winner .av{width:min(46vw,190px); box-shadow:0 0 0 5px var(--sun),0 0 60px rgba(255,206,31,.6)}
.crown{font-family:var(--display); font-size:clamp(1.8rem,8vw,2.8rem); line-height:1; color:var(--sun); text-shadow:4px 4px 0 #000; text-wrap:balance}
.vrow{display:grid; gap:8px; padding:12px 0; border-top:2px dashed #C9BEEA}
.vrow:first-of-type{border-top:0; padding-top:0}
.vhead{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}

.lost{background:var(--pink); color:var(--ink); border:3px solid var(--ink); border-radius:14px; padding:10px 14px; font-weight:700; text-align:center}
.botline{font-family:var(--display); font-size:clamp(1.15rem,5.2vw,1.6rem); line-height:1.25; color:var(--sun); text-wrap:balance; min-height:2.5em}
.lyrics{width:100%; text-align:left; background:#150A30; border:3px solid #000; border-radius:14px; padding:12px 14px; font-weight:500; line-height:1.5}
#toast{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); margin:0 auto; max-width:520px; z-index:20;
  background:var(--ink); color:var(--paper); border:3px solid var(--paper); border-radius:14px; padding:12px 16px; font-weight:500; text-align:center; overflow-wrap:anywhere}
.busy{min-height:55vh; display:grid; place-content:center; gap:16px; text-align:center}
.spin{width:54px; height:54px; margin:0 auto; border:6px solid var(--ink); border-top-color:var(--pink); border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:640px){ .creator{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} .fighter .av{transform:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* =====================================================================
   RHYME RUMBLE
   One file, no installs. Players exchange encrypted messages through
   public relay servers; the room's host device keeps the game state.
   ===================================================================== */
const GAME = 'Rhyme Rumble';
const ROOM_PREFIX = 'rhyme-rumble-v1-';
const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const RATE = 16000;           // voice clips travel as 16 kHz mu-law
const TOPICS = ['Freestyle: anything goes','Pizza vs. tacos','My pet is cooler than yours','Best excuse for not doing homework',
  'Monday mornings','Who is the real boss of this house?','Superpowers I should have','The worst vegetable ever','If I were the teacher',
  'Summer vs. winter','My sneakers are faster','Breakfast for dinner','Video game legends','Aliens landed in the backyard',
  'The dance floor is mine','Why I should stay up late','Robots doing my chores','Cats vs. dogs'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

/* ---------- rapper designer --------------------------------------- */
const AV = {
  skin:['#FFDFC4','#F2C09A','#D9A066','#B97A4A','#8D5524','#5C3A21'],
  hairc:['#1C1233','#5B3A1E','#D9A521','#C8431F','#2B6CF6','#FF4F8B','#19B58A','#F3F0FF'],
  fit:['#FF4F8B','#19C6C9','#7A4DFF','#FFCE1F','#FF7A1A','#27B863','#35284F','#F3F0FF'],
  bg:['#19C6C9','#FF4F8B','#7A4DFF','#FFCE1F','#27B863','#FF7A1A'],
  hair:['Bald','Short','Afro','Mohawk','Long','Buns','Locs','Cap','Beanie'],
  eyes:['Chill','Shades','Wink','Fierce','Stars'],
  mouth:['Smile','Grin','Ooh','Smirk','Gold teeth'],
  outfit:['Hoodie','Tee','Jacket','Jersey'],
  extra:['None','Chain','Headphones','Earring']
};
const AV_GROUPS = [
  ['skin','Skin','sw'],['hair','Hair or hat','chip'],['hairc','Hair or hat colour','sw'],['eyes','Eyes','chip'],
  ['mouth','Mouth','chip'],['outfit','Outfit','chip'],['fit','Outfit colour','sw'],['extra','Extras','chip'],['bg','Backdrop','sw']
];
const NAME_A = ['MC','DJ','Lil','Big','Young','Captain','Doctor','Sir','Queen','King','Professor'];
const NAME_B = ['Thunder','Pancake','Noodle','Rocket','Blizzard','Mango','Pixel','Tornado','Waffle','Comet','Sneaker','Yeti','Pickle','Laser','Banjo','Meatball','Turbo'];
const rnd = n => Math.floor(Math.random() * n);
const randomName = () => NAME_A[rnd(NAME_A.length)] + ' ' + NAME_B[rnd(NAME_B.length)];
const randomAv = () => Object.fromEntries(Object.keys(AV).map(k => [k, rnd(AV[k].length)]));
function cleanAv(a){ const o = {}; for(const k in AV){ const v = Number(a && a[k]) | 0; o[k] = v >= 0 && v < AV[k].length ? v : 0; } return o; }
const cleanName = n => (String(n ?? '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 18)) || 'Mystery MC';

function star(cx, cy, r){
  let p = ''; for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); }
  return p + 'Z';
}
function avatarSVG(cfg){
  const c = cleanAv(cfg), I = '#1C1233', S = AV.skin[c.skin], H = AV.hairc[c.hairc], F = AV.fit[c.fit];
  const st = `stroke="${I}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
  const hair = AV.hair[c.hair], fit = AV.outfit[c.outfit], eyes = AV.eyes[c.eyes], mouth = AV.mouth[c.mouth], extra = AV.extra[c.extra];
  let s = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rapper character"><rect width="200" height="200" fill="${AV.bg[c.bg]}"/>`;
  s += `<path d="M100 100 L-40 -40 L40 -60Z M100 100 L240 -40 L160 -60Z M100 100 L-60 120 L-60 60Z M100 100 L260 120 L260 60Z" fill="#fff" opacity=".16"/>`;
  // behind the head
  if(fit === 'Hoodie') s += `<path d="M46 156 C36 92 58 50 100 50 C142 50 164 92 154 156Z" fill="${F}" ${st}/>`;
  if(hair === 'Afro') s += `<circle cx="100" cy="72" r="57" fill="${H}" ${st}/>`;
  if(hair === 'Long') s += `<path d="M48 152 V80 C48 18 152 18 152 80 V152Z" fill="${H}" ${st}/>`;
  if(hair === 'Locs') for(const x of [42, 57, 129, 144]) s += `<rect x="${x}" y="58" width="14" height="${x === 42 || x === 144 ? 84 : 96}" rx="7" fill="${H}" ${st}/>`;
  if(hair === 'Buns') s += `<circle cx="62" cy="42" r="19" fill="${H}" ${st}/><circle cx="138" cy="42" r="19" fill="${H}" ${st}/>`;
  // body
  s += `<path d="M22 206 C22 160 60 144 100 144 C140 144 178 160 178 206Z" fill="${F}" ${st}/>`;
  s += `<path d="M84 116 V146 C84 160 116 160 116 146 V116Z" fill="${S}" ${st}/>`;
  if(fit === 'Hoodie') s += `<path d="M91 160 V180 M109 160 V180" fill="none" ${st}/>`;
  if(fit === 'Tee') s += `<path d="M78 148 C86 166 114 166 122 148" fill="none" ${st}/>`;
  if(fit === 'Jacket') s += `<path d="M100 172 V206 M76 148 L100 174 L124 148" fill="none" ${st}/><circle cx="110" cy="188" r="3" fill="${I}"/>`;
  if(fit === 'Jersey') s += `<path d="M78 148 C86 166 114 166 122 148" fill="none" ${st}/><text x="100" y="196" text-anchor="middle" font-family="Bungee,'Arial Black',sans-serif" font-size="26" fill="#fff" stroke="${I}" stroke-width="1.5">7</text>`;
  // head
  s += `<circle cx="58" cy="92" r="9" fill="${S}" ${st}/><circle cx="142" cy="92" r="9" fill="${S}" ${st}/>`;
  s += `<ellipse cx="100" cy="86" rx="42" ry="46" fill="${S}" ${st}/>`;
  // hair in front
  if(['Short','Long','Buns','Locs'].includes(hair)) s += `<path d="M58 82 C52 32 148 32 142 82 C128 60 72 60 58 82Z" fill="${H}" ${st}/>`;
  if(hair === 'Afro') s += `<path d="M59 80 C62 50 138 50 141 80 C124 62 76 62 59 80Z" fill="${H}"/>`;
  if(hair === 'Mohawk') s += `<path d="M85 54 L82 20 L93 36 L100 6 L107 36 L118 20 L115 54Z" fill="${H}" ${st}/>`;
  if(hair === 'Cap') s += `<path d="M56 78 C52 26 148 26 144 78Z" fill="${H}" ${st}/><path d="M52 74 H150 C176 74 180 94 152 90 L52 84Z" fill="${H}" ${st}/><circle cx="100" cy="38" r="4" fill="${I}"/>`;
  if(hair === 'Beanie') s += `<circle cx="100" cy="26" r="11" fill="#fff" ${st}/><path d="M56 74 C52 24 148 24 144 74Z" fill="${H}" ${st}/><rect x="50" y="64" width="100" height="18" rx="9" fill="${H}" ${st}/>`;
  // eyes
  if(eyes === 'Chill') s += `<circle cx="84" cy="90" r="5.5" fill="${I}"/><circle cx="116" cy="90" r="5.5" fill="${I}"/><path d="M76 77 Q84 72 92 77 M108 77 Q116 72 124 77" fill="none" ${st} stroke-width="4"/>`;
  if(eyes === 'Shades') s += `<path d="M64 82 H136 V92 C136 106 108 106 106 90 H94 C92 106 64 106 64 92Z" fill="${I}" ${st}/><path d="M72 88 H82 M112 88 H122" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  if(eyes === 'Wink') s += `<circle cx="84" cy="90" r="5.5" fill="${I}"/><path d="M109 91 Q116 84 123 91 M76 77 Q84 72 92 77" fill="none" ${st} stroke-width="4"/>`;
  if(eyes === 'Fierce') s += `<circle cx="84" cy="92" r="5.5" fill="${I}"/><circle cx="116" cy="92" r="5.5" fill="${I}"/><path d="M73 76 L94 83 M127 76 L106 83" fill="none" ${st}/>`;
  if(eyes === 'Stars') s += `<path d="${star(84, 90, 11)}${star(116, 90, 11)}" fill="#FFCE1F" ${st} stroke-width="3"/>`;
  // mouth
  if(mouth === 'Smile') s += `<path d="M84 109 Q100 125 116 109" fill="none" ${st}/>`;
  if(mouth === 'Grin') s += `<path d="M82 107 H118 C118 128 82 128 82 107Z" fill="#fff" ${st} stroke-width="4"/>`;

/* voice clips travel in chunks; anything that goes missing is asked for again */
function sendClip(to, id, pcm, only, mode = 'heavy'){
  const of = Math.ceil(pcm.length / CHUNK);
  for(let i = 0; i < of; i++) if(!only || only.includes(i)) netSend(to, { t:'vc', id, i, of }, pcm.subarray(i * CHUNK, (i + 1) * CHUNK), mode);

function rxChunk(m, bin){
  const id = String(m.id || '').slice(0, 16), of = m.of | 0, i = m.i | 0;
  if(!id || clips.has(id) || of < 1 || of > 45 || i < 0 || i >= of || !bin.length || bin.length > CHUNK) return;
  let p = net.partial.get(id); if(!p || p.of !== of){ if(net.partial.size > 6) net.partial.clear(); p = { of, parts:new Array(of), got:0 }; net.partial.set(id, p); }
  if(!p.parts[i]){ p.parts[i] = bin; p.got++; }
  if(p.got < of) return;
  const pcm = new Uint8Array(p.parts.reduce((a, b) => a + b.length, 0)); let o = 0; for(const x of p.parts){ pcm.set(x, o); o += x.length; }
  net.partial.delete(id); clips.set(id, makeClip(pcm));
  if(isHost){ const pv = net.pendingVerse.get(id); if(pv){ net.pendingVerse.delete(id); hostHandle(pv.pid, pv.m); } }

}
function askFor(id, to){

}
function resendClip(m, to){

  const now = Date.now(); if(now - (net.needAt.get(id) || 0) < 2500) return; net.needAt.set(id, now);
  const of = Math.ceil(c.pcm.length / CHUNK), only = Array.isArray(m.miss) && m.miss.length ? m.miss.filter(i => Number.isInteger(i) && i >= 0 && i < of) : null;
  sendClip(to, id, c.pcm, only, 'resend');       // a resend goes out on every relay, in case the two sides share only one
}

const randCode = () => Array.from({ length:6 }, () => CODE_LETTERS[rnd(CODE_LETTERS.length)]).join('');
function newState(code){
  return { v:0, code, host:me.pid, players:{}, order:[], phase:'lobby', turn:null, verses:[],
    set:{ beat:'boom', bars:8, rounds:2, a:null, b:null, topic:TOPICS[0] } };

function toast(msg, ms = 4200){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }
function setBusy(text){ view = 'busy'; busyText = text; render(); }
function netFail(e){
  if(e && e.message === 'cancelled') return;
  leave(true);
  toast(e && e.message === 'old' ? 'This browser is too old for online play. Try the newest Chrome or Safari.' : 'Could not reach the game network. Check the internet connection and try again.', 8000);
}

async function createRoom(){
  audio(); const code = randCode(); isHost = true; roomCode = code; setBusy('Opening your room…');
  try{ await netOpen(code); }catch(e){ return netFail(e); }
  S = newState(code); S.players[me.pid] = { name:me.name, av:me.av, on:true }; S.order = [me.pid];
  try{ history.replaceState(null, '', '#' + code); }catch{}
  view = 'room'; keepAwake(); startTick(); push();
}
function push(){ S.v++; netSend('a', { t:'state', s:S }); afterState(); }
function send(m){ if(isHost) hostHandle(me.pid, m); else netSend('h', m); }
function sayHi(){ const now = Date.now(); if(now - net.hiAt < 1000) return; net.hiAt = now; netSend('h', { t:'hi', name:me.name, av:me.av }); }

async function joinRoom(raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if(code.length !== 6) return toast('Room codes have 6 letters.');
  audio(); isHost = false; roomCode = code; setBusy('Finding room ' + code + '…');
  try{ await netOpen(code); }catch(e){ return netFail(e); }
  const gen = net.gen, t0 = Date.now(); net.lastHost = t0;
  while(!S){
    if(net.gen !== gen) return;
    if(Date.now() - t0 > 15000){ leave(true); return toast('Could not find room ' + code + '. Check the code, and make sure the host still has the game open.', 9000); }
    sayHi(); await sleep(1200);

}
function hostNet(m, bin){
  if(!S) return; const pid = m._f.slice(0, 24); net.lastSeen.set(pid, Date.now());
  switch(m.t){

    case 'bye': net.lastSeen.delete(pid); playerLeft(pid); break;
    case 'vc': rxChunk(m, bin); break;
    case 'need': resendClip(m, 'a'); break;
    case 'verse': { const id = String(m.id || '').slice(0, 16); if(clips.has(id)) hostHandle(pid, m); else { net.pendingVerse.set(id, { pid, m }); askFor(id, pid); } break; }

}
function guestNet(m, bin){
  if(S && m._f !== S.host){ if(m.t === 'lvl' && isTurn(m._f)) liveLevel = clamp(Number(m.v) || 0, 0, 1); return; }
  if(m.t !== 'state' && !S) return;
  net.lastHost = Date.now(); if(lost){ lost = false; render(); }
  switch(m.t){
    case 'state': {
      const s = m.s; if(!s || typeof s !== 'object' || s.code !== roomCode || !s.players || !Array.isArray(s.order)) return;
      if(S && s.v < S.v && S.v - s.v < 40) return;                       // an older copy that arrived late
      S = s;
      if(view === 'busy' || view === 'home'){ view = 'room'; keepAwake(); startTick(); try{ history.replaceState(null, '', '#' + S.code); }catch{} }
      if(!S.players[me.pid]) sayHi();
      afterState(); break;
    }
    case 'vc': rxChunk(m, bin); break;
    case 'lvl': liveLevel = clamp(Number(m.v) || 0, 0, 1); break;
    case 'who': if(m.to === me.pid) sayHi(); break;
    case 'need': if(m.to === me.pid) resendClip(m, 'h'); break;
    case 'closed': leave(true); toast('The host closed the room.', 6000); break;
  }
}
function netTick(){
  if(!S || !net.key) return; const now = Date.now(); net.tickN++;
  if(isHost){
    if(net.tickN % 2 === 0) netSend('a', { t:'state', s:S });
    for(const pid of [...S.order]) if(pid !== me.pid && S.players[pid] && S.players[pid].on && now - (net.lastSeen.get(pid) || 0) > 16000) playerLeft(pid);
    return;
  }
  if(net.tickN % 2 === 0) netSend('h', { t:'ping' });
  const quiet = now - net.lastHost;
  if(quiet > 180000){ leave(true); return toast('The room has closed.', 6000); }
  if((quiet > 13000) !== lost){ lost = quiet > 13000; render(); }
  const v = curVerse();
  if(v && !v.skipped && !clips.has(v.id)){ if(!net.missSince) net.missSince = now; else if(now - net.missSince > 2500) askFor(v.id); } else net.missSince = 0;

  if(o){ if(!(isTurn(me.pid) && S.turn.step === 'rec')) net.outVerse = null; else if(now - o.at > 5000){ o.at = now; netSend('h', { t:'verse', id:o.id, judge:o.judge, bars:o.bars }); } }
}
function leave(silent){
  stopAudio(); abortRec(); stopBot();

  netClose();
  isHost = false; S = null; lost = false; clips.clear(); autoPlayed.clear(); heard.clear();

/* ---------- game rules (run on the host device) -------------------- */
const performer = () => S && S.turn ? (S.turn.i % 2 === 0 ? S.set.a : S.set.b) : null;
const isTurn = pid => S && S.phase === 'battle' && performer() === pid;
const curVerse = () => S && S.phase === 'battle' && S.turn.step === 'listen' ? S.verses[S.verses.length - 1] : null;
const c10 = v => clamp(Math.round(Number(v) || 0), 0, 10);
function fixBattlers(){
  const ok = p => p && S.players[p]; const set = S.set;
  if(!ok(set.a)) set.a = null; if(!ok(set.b) || set.b === set.a) set.b = null;
  for(const p of S.order){ if(!set.a && p !== set.b) set.a = p; else if(!set.b && p !== set.a) set.b = p; }
}
function playerLeft(pid){
  if(!S || !S.players[pid]) return;
  if(S.phase === 'lobby'){ delete S.players[pid]; S.order = S.order.filter(p => p !== pid); fixBattlers(); }

  push();
}
function hostHandle(pid, m){
  if(!S) return;
  switch(m.t){
    case 'hi': case 'me':
      S.players[pid] = { name:cleanName(m.name), av:cleanAv(m.av), on:true };
      if(!S.order.includes(pid)) S.order.push(pid);
      if(S.phase === 'lobby') fixBattlers();
      push(); break;
    case 'go': if(isTurn(pid) && S.turn.step === 'ready'){ S.turn.step = 'rec'; push(); } break;
    case 'cancel': if(isTurn(pid) && S.turn.step === 'rec'){ S.turn.step = 'ready'; push(); } break;
    case 'lvl': if(isTurn(pid) && pid !== me.pid) liveLevel = clamp(Number(m.v) || 0, 0, 1); break;
    case 'verse': {
      if(!isTurn(pid) || S.turn.step !== 'rec') break;
      const id = String(m.id || '').slice(0, 16), c = clips.get(id), j = m.judge || {};
      if(!c || c.pcm.length > RATE * 75) break;
      S.verses.push({ id, by:pid, round:Math.floor(S.turn.i / 2) + 1, beat:S.set.beat, bars:clamp(Math.round(Number(m.bars)) || 1, 1, 16),
        dur:c.pcm.length / RATE, judge:{ flow:c10(j.flow), energy:c10(j.energy), stamina:c10(j.stamina) }, ratings:{} });
      S.turn.step = 'listen';
      sendClip('a', id, c.pcm);
      push(); break;
    }
    case 'rate': {
      const v = S.verses.find(x => x.id === m.id), n = Math.round(Number(m.n));
      if(v && !v.skipped && canRate(pid, v) && n >= 1 && n <= 5){ v.ratings[pid] = n; push(); }
      break;
    }
  }
}
function crowdOf(v){ if(S.solo) return []; const battlers = [S.set.a, S.set.b]; const fans = S.order.filter(p => S.players[p] && S.players[p].on && !battlers.includes(p)); return fans.length ? fans : battlers.filter(p => p !== v.by); }

  const judge = v.judge.flow + v.judge.energy + v.judge.stamina, r = Object.values(v.ratings);
  const avg = r.length ? r.reduce((a, b) => a + b, 0) / r.length : 0, crowd = Math.round(avg * 4);

function totals(hideCurrent){
  const t = { [S.set.a]:0, [S.set.b]:0 }, cur = hideCurrent ? curVerse() : null;
  for(const v of S.verses) if(v !== cur) t[v.by] = (t[v.by] || 0) + verseScore(v).total;

const host = {
  set(k, v){ if(S.phase !== 'lobby') return; S.set[k] = v; push(); },
  pick(pid){ if(S.phase !== 'lobby' || !S.players[pid]) return; const s = S.set;
    if(s.a === pid) s.a = null; else if(s.b === pid) s.b = null; else if(!s.a) s.a = pid; else if(!s.b) s.b = pid; else { s.a = s.b; s.b = pid; }
    push(); },
  start(){ const s = S.set; if(!s.a || !s.b) return toast('Pick two rappers for the battle first.');

  next(){ if(S.phase !== 'battle') return; S.turn.i++; if(S.turn.i >= S.set.rounds * 2){ S.phase = 'results'; S.turn = null; } else S.turn.step = 'ready'; push(); },
  end(){ if(S.phase === 'lobby') return; S.phase = 'lobby'; S.turn = null; S.verses = [];

let dlBusy = false;
function wavBlob(d, rate){

  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, d.length * 2, true);
  for(let i = 0; i < d.length; i++){ const s = clamp(d[i], -1, 1); v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true); }

}
async function renderBattle(){
  const SR = 32000, vs = S.verses.filter(v => !v.skipped && clips.has(v.id)); if(!vs.length) return null;
  let total = .3; const plan = vs.map(v => { const c = clips.get(v.id), bar = 240 / (BEATS[v.beat] || BEATS.boom).bpm, at = total; total += Math.max(v.bars * bar, c.f.length / RATE) + .8; return { v, c, at }; });
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext, oc = new OC(1, Math.ceil(total * SR), SR);

  for(const { v, c, at } of plan){

    const buf = oc.createBuffer(1, c.f.length, RATE); buf.getChannelData(0).set(c.f);
    const src = oc.createBufferSource(), g = oc.createGain(); g.gain.value = 1.3; src.buffer = buf; src.connect(g); g.connect(master); src.start(at);

async function startVerse(){
  if(rec || !isTurn(me.pid) || S.turn.step !== 'ready') return;
  stopAudio();
  const ac = audio(); let mic;
  try{ mic = await openMic(); }catch(e){ return toast(micHelp(e), 7000); }
  if(!isTurn(me.pid) || S.turn.step !== 'ready'){ mic.close(); return; }
  const out = ac.createGain(); out.gain.value = .8; out.connect(MASTER);
  const sch = scheduleBeat(ac, out, S.set.beat, ac.currentTime + .45, S.set.bars, true);
  const lat = clamp((ac.outputLatency || 0) + (ac.baseLatency || 0) + mic.inLat, 0, .35);
  mic.chunks = [];
  rec = { mic, out, sch, lat, beat:S.set.beat, bars:S.set.bars, done:false, lastLvl:0 };
  rec.timer = setTimeout(() => finishVerse(), (sch.end + lat - ac.currentTime) * 1000 + 180);
  send({ t:'go' }); render();
}

  const r = rec; if(!r || r.done) return; r.done = true; clearTimeout(r.timer);

  render();

    const x = new Float32Array(n);
    for(const { f, b } of chunks){ const off = f - f0; if(off >= n || off + b.length <= 0) continue;
      const a = Math.max(0, -off), z = Math.min(b.length, n - off); x.set(b.subarray(a, z), off + a); }
    const y = downsample(x, sr, RATE), bpm = BEATS[r.beat].bpm;

}

function tick(){
  requestAnimationFrame(tick);
  if(view !== 'room' || !S) return;
  const ac = AC; let lvl = 0;
  if(bot && ac){
    const t = ac.currentTime, b = bot, pre = t < b.sch.verseStart, cnt = $('#botcount'), box = $('#botbars');
    if(cnt) cnt.hidden = !pre; if(box) box.hidden = pre;
    if(pre){ if(cnt) cnt.textContent = clamp(Math.ceil((b.sch.verseStart - t) / (b.sch.step * 4)), 1, 4); }
    else {
      const pos = (t - b.sch.verseStart) / b.sch.bar, i = clamp(Math.floor(pos), 0, b.lines.length - 1);
      const ln = $('#botline'), nx = $('#botnext'), pr = $('#botprog');
      if(ln && ln.textContent !== b.lines[i]) ln.textContent = b.lines[i];
      if(nx){ const n = b.lines[i + 1] || ''; if(nx.textContent !== n) nx.textContent = n; }
      if(pr) pr.style.width = clamp(pos / b.lines.length * 100, 0, 100) + '%';
      lvl = b.voiced ? (b.talking ? .3 + Math.random() * .55 : .05) : .25 + .3 * Math.abs(Math.sin(t * 9));
    }
  } else if(rec && !rec.done && ac){

      if(cnt) cnt.hidden = !pre; if(brs) brs.hidden = pre;
      if(pre){ if(cnt) cnt.textContent = clamp(Math.ceil((r.sch.verseStart - t) / (r.sch.step * 4)), 1, 4); }
      else {
        const pos = (t - r.sch.verseStart) / r.sch.bar, bar = clamp(Math.floor(pos) + 1, 1, r.bars), beat = Math.floor((pos % 1) * 4);

  } else if(playing && ac){

    <div class="crew">${S.order.map(p => tile(p, isHost)).join('')}</div>
    <p class="small">${isHost ? (S.order.length < 2 ? 'Waiting for players. Share the code above.' : 'Tap two rappers to put them in the battle. Everyone else is the crowd.') : 'The host picks who battles.'}</p>
    <div class="row"><button class="btn teal mini" data-act="creator">Change my look</button><button class="btn mini" data-act="miccheck" ${micTest ? 'disabled' : ''}>${micTest ? 'Say something…' : 'Mic check'}</button>
      ${micTest ? '<span class="meter grow" style="min-width:90px"><i></i></span>' : ''}</div>
  </section>
  <section class="card"><h2>Battle setup</h2>
    <div class="group"><span class="lab">Beat</span><div class="opts">${chips('beat', Object.entries(BEATS).map(([id, b]) => [id, `${b.name} · ${b.bpm} BPM`]))}</div>
      <div><button class="btn mini" data-act="hear">Hear the beat</button></div></div>
    <div class="group"><span class="lab">Verse length</span><div class="opts">${chips('bars', [[4, '4 bars'], [8, '8 bars'], [16, '16 bars']])}</div>
      <span class="small">${s.bars} bars of ${BEATS[s.beat].name} is about ${Math.round(s.bars * 240 / BEATS[s.beat].bpm)} seconds.</span></div>
    <div class="group"><span class="lab">Rounds</span><div class="opts">${chips('rounds', [[1, '1'], [2, '2'], [3, '3']])}</div></div>
    <div class="group"><span class="lab">Topic</span><div class="topic">${esc(s.topic)}</div>
      ${isHost ? '<div><button class="btn mini sun" data-act="spin">Spin a new topic</button></div>' : ''}</div>
  </section>
  ${isHost ? `<button class="btn pink big" data-act="start" ${ready ? '' : 'disabled'}>${ready ? 'Start the battle' : 'Need two rappers'}</button>`
           : `<p class="center" style="font-weight:700">Waiting for ${esc(hostName)} to start the battle…</p>`}
  <div class="center"><button class="btn mini" data-act="leave">Leave room</button></div>`;
}
function fighter(pid, on, pts){
  const p = S.players[pid] || { name:'Gone', av:{} };
  return `<div class="fighter${on ? ' on' : ''}">${avHTML(p.av)}<span class="nm">${esc(p.name)}</span><span class="pts">${pts}</span></div>`;
}
function judgeCard(v){
  const sc = verseScore(v), j = v.judge;
  const stat = (label, n) => `<div class="stat"><span>${label}</span><span class="bar"><i style="width:${n * 10}%"></i></span><span class="n">${n}</span></div>`;
  return `<div class="judge"><div class="who"><span class="bot">${BOT_SVG}</span><div class="grow"><span class="lab">Boombot says</span><div style="font-weight:700">${esc(judgeSays(j))}</div></div></div>
    ${stat('Flow', j.flow)}${stat('Energy', j.energy)}${stat('Stamina', j.stamina)}
    <div class="sum"><span class="pill">Boombot ${sc.judge}/30</span>${S.solo ? '' : `<span class="pill">Crowd ${sc.n ? sc.avg.toFixed(1) + ' mics = ' + sc.crowd : '…'}/20</span>`}<span class="pill tot">${sc.total} points</span></div></div>`;
}
function micsRow(v){
  const mine = v.ratings[me.pid] || 0;
  return `<div class="group" style="justify-items:center"><span class="lab" style="color:#CFC4F2">How many mics for those rhymes?</span><div class="mics">${
    [1, 2, 3, 4, 5].map(n => `<button class="mic${n <= mine ? ' lit' : ''}" aria-label="${n} microphone${n > 1 ? 's' : ''}" aria-pressed="${n === mine}" data-act="rate" data-n="${n}" data-id="${esc(v.id)}">${MIC_ICON}</button>`).join('')}</div></div>`;
}
function battleView(){
  const s = S.set, t = S.turn, cur = performer(), mine = cur === me.pid, P = S.players[cur] || { name:'?' }, tot = totals(true);
  const round = Math.floor(t.i / 2) + 1, hostName = S.players[S.host] ? S.players[S.host].name : 'the host';
  let panel = '';
  if(t.step === 'ready'){
    panel = mine
      ? `<h2>Your turn, ${esc(P.name)}!</h2><p>${s.bars} bars of ${BEATS[s.beat].name}. You get a 4-beat count-in, then go.</p>
         <button class="btn pink big" data-act="drop">Drop the beat</button><p class="small">Headphones sound best. The mic switches off when your verse ends.</p>`
      : cur === 'robot' ? `<h2>${esc(P.name)} is up next</h2><p>${s.bars} bars of ${BEATS[s.beat].name}. Listen and read along.</p><button class="btn pink big" data-act="robotgo">Bring it on</button>`
      : `<h2>${esc(P.name)} is warming up…</h2><p class="small">${s.bars} bars of ${BEATS[s.beat].name} coming up.</p>${P.on === false ? '<p>They seem to have lost their connection.</p>' : ''}`;
  } else if(t.step === 'rec'){
    if(mine && rec && !rec.done) panel = `<div id="recbox" style="display:grid;gap:14px;justify-items:center;width:100%">
        <span class="onair">Mic is on</span>
        <div id="reccount" class="count">4</div>
        <div id="recbars" style="display:grid;gap:12px;width:100%;justify-items:center" hidden>
          <div class="bars" id="recbar">Bar 1 of ${s.bars}</div><div class="dots" id="recdots"><b></b><b></b><b></b><b></b></div>
          <div class="track"><i id="recprog"></i></div></div>
        <div class="meter"><i></i></div>
        <button class="btn mini" data-act="done">I'm done</button></div>`;
    else if(mine && rec) panel = `<div class="spin" style="border-color:#000;border-top-color:var(--pink)"></div><h2>Sending your verse…</h2>`;
    else if(mine) panel = `<h2>Sending your verse…</h2><p class="small">Taking too long?</p><button class="btn mini" data-act="redo">Record it again</button>`;
    else if(cur === 'robot') panel = `<span class="onair">On the mic</span>
        <div id="botcount" class="count">4</div>
        <div id="botbars" style="display:grid;gap:12px;width:100%;justify-items:center" hidden>
          <div class="botline" id="botline"></div><div class="small" id="botnext"></div><div class="track"><i id="botprog"></i></div></div>
        ${bot && !bot.voiced ? '<p class="small">No voice for this language on this device. Read along!</p>' : ''}`;
    else panel = `<span class="onair">On the mic</span><h2>${esc(P.name)} is rapping</h2>
        <div class="eq">${[40, 75, 55, 95, 60, 85, 45].map(k => `<i style="--k:${k}"></i>`).join('')}</div><p class="small">You will hear the verse as soon as it is done.</p>`;
  } else {
    const v = curVerse(), has = clips.has(v.id), now = playing && playing.id === v.id, done = heard.has(v.id);
    const crowd = crowdOf(v), got = crowd.filter(p => v.ratings[p]).length;
    if(v.robot) panel = `<h2>That was: ${esc(P.name)}</h2><div class="lyrics">${v.lines.map(esc).join('<br>')}</div>${judgeCard(v)}
      <button class="btn pink big" data-act="next">${t.i + 1 >= s.rounds * 2 ? 'See the results' : 'Next verse'}</button>`;
    else panel = `<h2>${now ? 'Now playing' : 'That was'}: ${esc(P.name)}</h2>
      ${has ? `<div class="track"><i id="playprog" style="${now ? '' : 'width:100%'}"></i></div>
               <div class="row" style="justify-content:center"><button class="btn mini teal" data-act="replay" data-id="${esc(v.id)}">${now ? 'Start over' : 'Play it again'}</button></div>`
            : `<div class="spin" style="border-color:#000;border-top-color:var(--pink)"></div><p class="small">Getting the verse…</p>`}
      ${S.solo ? '' : canRate(me.pid, v) ? micsRow(v) : `<p class="small">${v.by === me.pid ? 'The crowd is rating your verse.' : 'The crowd is rating this verse.'}</p>`}
      ${done ? judgeCard(v) : `<p class="small">Boombot is listening…</p>`}
      ${S.solo ? '' : `<p class="small">${got} of ${crowd.length} crowd rating${crowd.length === 1 ? '' : 's'} in</p>`}
      ${isHost ? `<button class="btn pink big" data-act="next">${t.i + 1 >= s.rounds * 2 ? 'See the results' : 'Next verse'}</button>` : `<p class="small">Waiting for ${esc(hostName)} to continue…</p>`}`;
  }
  return `<div class="hud"><span>Round ${round} of ${s.rounds}</span><span class="t">${esc(s.topic)}</span></div>
    <div class="face">${fighter(s.a, cur === s.a, tot[s.a] || 0)}<span class="vs">VS</span>${fighter(s.b, cur === s.b, tot[s.b] || 0)}</div>
    <section class="panel">${panel}</section>
    ${isHost ? `<div class="hostbar"><button class="btn mini" data-act="end">${S.solo ? 'Quit battle' : 'End battle'}</button></div>` : ''}`;
}
function resultsView(){
  const s = S.set, tot = totals(false), a = tot[s.a] || 0, b = tot[s.b] || 0, tie = a === b, w = a >= b ? s.a : s.b;
  const W = S.players[w] || { name:'?', av:{} }, hostName = S.players[S.host] ? S.players[S.host].name : 'the host';
  const rows = S.verses.map(v => { const P = S.players[v.by] || { name:'?' }, sc = verseScore(v);
    return `<div class="vrow"><div class="vhead"><strong>Round ${v.round} · ${esc(P.name)}</strong>
      ${v.skipped ? '<span class="pill">Skipped</span>' : v.robot ? '<span class="pill">Robot</span>' : clips.has(v.id) ? `<button class="btn mini teal" data-act="replay" data-id="${esc(v.id)}">${playing && playing.id === v.id ? 'Start over' : 'Play'}</button>` : ''}</div>
      ${v.skipped ? '' : `<div class="sum"><span class="pill">Flow ${v.judge.flow}</span><span class="pill">Energy ${v.judge.energy}</span><span class="pill">Stamina ${v.judge.stamina}</span>${S.solo ? '' : `<span class="pill">Crowd ${sc.crowd}/20</span>`}<span class="pill tot">${sc.total}</span></div>`}</div>`; }).join('');
  return `<div class="winner">${tie ? `<div class="crown">It's a tie!</div><p>${a} points each. Settle it with a rematch.</p>`
      : `<span class="lab" style="color:#CFC4F2">Winner</span>${avHTML(W.av)}<div class="crown">${esc(W.name)}</div>`}</div>
    <div class="face">${fighter(s.a, tie || w === s.a, a)}<span class="vs">VS</span>${fighter(s.b, tie || w === s.b, b)}</div>
    <section class="card"><h2>Every verse</h2>${rows || '<p>No verses were recorded.</p>'}
      <p class="small">${S.solo ? 'Each verse scores up to 30 from Boombot.' : 'Each verse scores up to 30 from Boombot and up to 20 from the crowd.'}</p></section>
    ${S.verses.some(v => clips.has(v.id)) ? `<button class="btn sun big" data-act="download" ${dlBusy ? 'disabled' : ''}>${dlBusy ? 'Making the sound file…' : 'Download the battle'}</button>
      <p class="small center">${S.solo ? 'Saves your verses with the beat as one sound file. The robot\'s voice cannot be recorded.' : 'Saves every verse with the beat as one sound file (WAV).'}</p>` : ''}
    ${isHost ? `<div class="row"><button class="btn pink grow" data-act="rematch">Rematch</button><button class="btn grow" data-act="end">${S.solo ? 'Back to start' : 'Back to the lobby'}</button></div>`
             : `<p class="center small">Waiting for ${esc(hostName)} to pick what happens next…</p>`}`;
}

/* ---------- events ------------------------------------------------- */
function saveMe(){ store.set('rr.me', { name:me.name, av:me.av }); if(S) send({ t:'me', name:me.name, av:me.av }); }
async function invite(){
  const url = location.origin + location.pathname + location.search + '#' + S.code;
  const text = `Join my ${GAME} room ${S.code}: ${url}`;
  try{ if(navigator.share && matchMedia('(pointer:coarse)').matches){ await navigator.share({ title:GAME, text, url }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(url); toast('Invite link copied. Send it to your crew!'); }catch{ toast(url, 12000); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'creator': draft = { name:me.name, av:{ ...me.av } }; creatorBack = view; view = 'creator'; render(); scrollTo(0, 0); break;
    case 'opt': draft.av[el.dataset.k] = Number(el.dataset.i); render(); break;
    case 'rname': draft.name = randomName(); render(); break;
    case 'rlook': draft.av = randomAv(); render(); break;
    case 'cancelcreator': view = creatorBack; render(); break;
    case 'savecreator': me.name = cleanName(draft.name); me.av = cleanAv(draft.av); view = creatorBack; saveMe(); render(); break;
    case 'create': createRoom(); break;
    case 'leave': leave(); break;
    case 'home': view = 'home'; render(); scrollTo(0, 0); break;
    case 'solo': view = 'solo'; render(); scrollTo(0, 0); break;
    case 'soloset': { const k = el.dataset.k, v = el.dataset.v; solo[k] = k === 'bars' || k === 'rounds' ? Number(v) : v; if(k === 'beat') previewBeat(v); render(); break; }
    case 'solostart': startSolo(); break;
    case 'robotgo': robotGo(); break;
    case 'download': downloadBattle(); break;
    case 'invite': invite(); break;
    case 'miccheck': micCheck(); break;
    case 'hear': previewBeat(S.set.beat); break;
    case 'drop': startVerse(); break;
    case 'done': finishVerse(); break;
    case 'redo': net.outVerse = null; send({ t:'cancel' }); break;
    case 'replay': { const v = S.verses.find(x => x.id === el.dataset.id); if(v) playVerse(v); break; }
    case 'rate': audio(); send({ t:'rate', id:el.dataset.id, n:Number(el.dataset.n) }); break;
  }
  if(!isHost || !S) return;
  switch(act){
    case 'pick': host.pick(el.dataset.pid); break;
    case 'set': { const k = el.dataset.k, v = el.dataset.v; host.set(k, k === 'beat' ? v : Number(v)); if(k === 'beat') previewBeat(v); break; }
    case 'spin': { let t; do t = TOPICS[rnd(TOPICS.length)]; while(t === S.set.topic); host.set('topic', t); break; }
    case 'start': host.start(); break;
    case 'next': host.next(); break;
    case 'end': if(S.solo) leave(); else host.end(); break;
    case 'rematch': host.rematch(); break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'rapname' && draft) draft.name = e.target.value;
  if(e.target.id === 'code'){ joinCode = e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6); }
});
document.addEventListener('submit', e => { e.preventDefault(); if(e.target.dataset.form === 'join') joinRoom($('#code').value); });
window.addEventListener('pagehide', () => { if(S && net.key){ if(isHost) netSend('a', { t:'closed' }); else netSend('h', { t:'bye' }); } });

/* ---------- boot --------------------------------------------------- */
joinCode = (location.hash || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 6);
render();
</script>
</body>
</html>
